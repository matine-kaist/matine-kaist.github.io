{% if include.width %}
<div class="image-wrapper" style="width: {{ include.width }}; margin: auto;">
{% else %}
<div class="image-wrapper">
{% endif %}
  {% if include.url %}
  <a href="{{ include.url }}" title="{{ include.title }}" target="_blank">
  {% endif %}

  <img src="{{ include.img }}" alt="{{ include.title }}"/>

  {% if include.url %}
  </a>
  {% endif %}

  {% if include.caption %}
  <p class="image-caption">{{ include.caption }}</p>
  {% endif %}

</div>
