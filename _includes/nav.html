<nav class="top-nav" role="navigation" aria-label="Main navigation">
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}">
    <div class="brand-logo-wrap">
      <img class="brand-img brand-wordmark" src="{{ '/assets/img/lab-matine.png' | relative_url }}" alt="{{ site.title }}">
      <img class="brand-img brand-icon"     src="{{ '/assets/img/lab-logo.png'   | relative_url }}" alt="{{ site.title }}">
    </div>
  </a>

  <button class="nav-toggle" id="nav-toggle"
          aria-label="Toggle navigation"
          aria-expanded="false"
          aria-controls="nav-links">
    <span class="nav-toggle-bar"></span>
    <span class="nav-toggle-bar"></span>
    <span class="nav-toggle-bar"></span>
  </button>

  <ul class="nav-links" id="nav-links" role="list">
    {% for item in site.nav_items %}
      <li class="nav-item{% if item.children %} has-dropdown{% endif %}">
        <a class="nav-link{% if page.url == item.url %} active{% endif %}"
           href="{{ item.url | relative_url }}">
          {{ item.title }}
        </a>
        {% if item.children %}
          <ul class="nav-dropdown" role="list">
            {% for child in item.children %}
              <li>
                <a class="nav-link nav-dropdown-link{% if page.url == child.url %} active{% endif %}"
                   href="{{ child.url | relative_url }}">{{ child.title }}</a>
              </li>
            {% endfor %}
          </ul>
        {% endif %}
      </li>
    {% endfor %}
    <li>{% include theme-toggle.html %}</li>
  </ul>
</nav>
